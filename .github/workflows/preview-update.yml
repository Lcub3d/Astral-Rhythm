name: Verify reviewed preview implementation

on:
  push:
    branches: [main]
    paths: ['.delivery/**']

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Lcub3d/Astral-Rhythm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Validate source transfer and apply reviewed patch
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, lzma, subprocess, tempfile
          expected_base = '25214f555ad31bad3bb3a8eb8902694d6fce7938'
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if base != expected_base:
              raise SystemExit('Source baseline changed; review the patch before applying')
          parts = sorted(Path('.delivery').glob('part-*.b64'))
          if [p.name for p in parts] != [f'part-{n}.b64' for n in range(7)]:
              raise SystemExit('Unexpected source transfer files')
          packed = base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in parts), validate=True)
          if len(packed) != 18200 or hashlib.sha256(packed).hexdigest() != '3a2741c2999689e55d7dccdc98acc14420b212065b2b5c29f6612300e9f646fa':
              raise SystemExit('Source transfer checksum mismatch')
          patch = lzma.decompress(packed)
          if len(patch) != 59320 or hashlib.sha256(patch).hexdigest() != '772e7c157c02d11ad10b20076d66496c307351e6de077c786cb2bd3f5668138b':
              raise SystemExit('Reviewed patch checksum mismatch')
          allowed = {
              '.agents/skills/astral-ui/SKILL.md', 'CHANGELOG.md', 'README.en.md',
              'README.md', 'RELEASE_NOTES.md', 'docs/PREVIEW.md', 'src/core.go',
              'src/layout.go', 'src/locale.go', 'src/locale_test.go',
              'src/main_windows.go', 'src/preview.go', 'src/preview_layout.go',
              'src/preview_test.go', 'src/preview_windows.go',
              'src/preview_windows_test.go', 'src/snapshot_windows_test.go',
              'src/ui_windows.go', 'tools/build_docs.py'
          }
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 'preview.patch'
              path.write_bytes(patch)
              subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
              subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if staged != allowed:
              raise SystemExit('Unexpected changed paths')
          subprocess.run(['git', 'rm', '--', *[str(p) for p in parts]], check=True)
      - name: Test reviewed logic and layouts
        working-directory: src
        run: |
          go test -v ./...
          go vet ./...
      - name: Commit verified implementation
        id: commit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          actual=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$actual" != "$EXPECTED_HEAD" ]; then
            echo 'Main changed during validation; refusing to overwrite it'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add independent on-demand day and shichen previews'
          git push origin HEAD:main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-check:
    needs: apply
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml
    with:
      revision: ${{ needs.apply.outputs.revision }}
