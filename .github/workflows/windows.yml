name: Windows build and tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'data.json', 'locales/**', '表格/**', '*.cmd', 'AstralRhythm.ico', '.gitattributes', '.github/workflows/windows.yml']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Cross-platform tests and vet
        working-directory: src
        run: |
          go test -v ./...
          go vet ./...
  windows:
    runs-on: windows-latest
    needs: logic
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          architecture: x64
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Regenerate Windows icon, version and DPI resources
        run: python tools/build_resources.py
      - name: Native Windows unit tests and reproducible UI renders
        working-directory: src
        env:
          ASTRAL_DOCS_DIR: ../docs/images
        run: |
          New-Item -ItemType Directory -Force ../validation | Out-Null
          go test -v ./... 2>&1 | Tee-Object ../validation/go-test-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compose illustrated README assets
        run: |
          python -m pip install Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows x64
        working-directory: src
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o ../AstralRhythm.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check embedded executable version
        run: |
          $source = Get-Content src/locale.go -Raw
          $version = [regex]::Match($source, 'const appVersion = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          $actual = (Get-Item AstralRhythm.exe).VersionInfo
          if ($actual.FileVersion -ne $version -or $actual.ProductVersion -ne $version) { throw 'EXE version does not match source' }
          Write-Output "Executable FileVersion=$($actual.FileVersion), ProductVersion=$($actual.ProductVersion)"
      - name: Package app, source, workbooks and translations
        run: python tools/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: Astral-Rhythm-Windows-x64-and-source
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: Astral-Rhythm-native-docs
          path: docs/images/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: Astral-Rhythm-publish-files
          path: |
            docs/images/*
            src/resources_windows_amd64.syso
          if-no-files-found: error
          retention-days: 30
